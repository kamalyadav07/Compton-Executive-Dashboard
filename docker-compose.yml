version: '3.8'

services:
  # 1. Managed/Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: compton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compton_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-compton_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compton_admin -d compton_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Managed/Local Redis Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: compton-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend REST API Process
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: compton-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://compton_admin:secure_local_dev_password@postgres:5432/compton_dashboard
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}

  # 4. Background Sync & ML Worker Process
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: compton-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://compton_admin:secure_local_dev_password@postgres:5432/compton_dashboard
      REDIS_URL: redis://redis:6379
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}

volumes:
  pgdata:
  redisdata:
