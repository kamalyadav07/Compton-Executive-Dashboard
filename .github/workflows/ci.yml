name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Unit Tests & ML Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Check & Production Build
        run: npm run build

      - name: Run Vitest Unit & ML Tests
        run: npm test

      - name: Run Chatbot Intent & Routing Regression Benchmark
        run: node server/eval/runChatbotEval.js
